<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16324a"><title>Práctica PER</title><link rel="stylesheet" href="./styles.css"></head><body>
<header class="top"><div class="wrap"><span class="brand">PER <span>· práctica</span></span><span id="saved" class="saved" aria-live="polite"></span></div></header>
<main class="wrap"><section id="start" class="panel"><p class="eyebrow">BANCO DE PREGUNTAS</p><h1>Prepará tu examen PER</h1><p id="intro">Cargando preguntas…</p><div class="grid"><label>Modo de práctica<select id="mode"><option value="order">Todas en orden</option><option value="random">Todas al azar</option><option value="incorrect">Solo las respondidas incorrectamente</option></select></label><label>Tema<select id="topic"><option value="all">Todos los temas</option></select></label></div><p id="available" class="muted"></p><div class="actions"><button id="begin" class="primary" disabled>Comenzar práctica</button><button id="reset" class="quiet">Borrar progreso</button></div><p id="start-message" class="message" role="status"></p></section>
<section id="practice" class="panel hidden" aria-label="Pregunta de práctica"><div class="meter"><span id="position"></span><span id="score"></span></div><div class="bar"><span id="bar-fill"></span></div><p id="question-topic" class="eyebrow"></p><h2 id="question-text"></h2><div id="question-figure"></div><form id="answers"><fieldset><legend class="sr-only">Elegí una respuesta</legend><div id="choices"></div></fieldset></form><p id="feedback" class="feedback hidden" role="status" aria-live="polite"></p><div class="actions"><button id="check" class="primary" type="button" disabled>Comprobar respuesta</button><button id="next" class="primary hidden" type="button">Siguiente pregunta</button><button id="exit" class="quiet" type="button">Volver al inicio</button></div></section>
<section id="finish" class="panel hidden"><p class="eyebrow">SESIÓN COMPLETADA</p><h1>¡Práctica terminada!</h1><div id="summary" class="summary"></div><div class="actions"><button id="retry" class="primary">Practicar errores</button><button id="again" class="quiet">Empezar de nuevo</button></div></section></main><footer class="wrap foot">Tus respuestas quedan guardadas en este navegador. Sin cuentas ni seguimiento.</footer><script src="./app.js" defer></script></body></html>
